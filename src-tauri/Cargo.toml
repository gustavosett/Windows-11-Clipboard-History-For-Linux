[package]
name = "windows-11-style-clipboard-history-manager"
version = "2.5.0"
description = "A Windows 11-style Clipboard History Manager for Linux"
authors = ["Mahdi Arts"]
license = "MIT"
repository = "https://github.com/Mahdi-Arts/Windows-11-Style-Clipboard-History-Manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "windows_11_style_clipboard_history_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "windows-11-style-clipboard-history-manager-bin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"

# Clipboard Management - wayland-data-control for native Wayland support
arboard = { version = "3.4", features = ["image-data", "wayland-data-control"] }

# Async Runtime
tokio = { version = "1.52.2", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image Handling
image = "0.25.10"
base64 = "0.23"

# HTTP client — only compiled when GIF search is enabled.
# کلاینت HTTP — فقط وقتی جستجوی GIF فعال باشد کامپایل می‌شود.
reqwest = { version = "0.13.3", optional = true, features = ["blocking", "stream", "json"] }

# Utilities
once_cell = "1.21.4"
parking_lot = "0.12"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "v5", "serde"] }
dirs = "6.0"

tauri-plugin-single-instance = "2.4.2"

# Global shortcut plugin for cross-platform hotkeys
tauri-plugin-global-shortcut = "2"

# System information
whoami = "2.1.2"

# URL encoding for LXQt shortcuts
percent-encoding = "2.3"

# X11 Simulation for paste injection
# The `xfixes` feature enables event-driven clipboard wakeups (SelectionNotify).
# فعال‌سازی `xfixes` برای بیدارباش رویدادمحور کلیپ‌بورد (SelectionNotify).
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xtest", "xfixes"] }
libc = "0.2"
gtk = "0.18"
# D-Bus for XDG Desktop Portal (theme detection for COSMIC and other DEs)
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }
futures-lite = "2"

# Error handling
thiserror = "2"

# Logging & Tracing
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# URL parsing for SSRF protection
url = "2"

# Local history database (bundled SQLite — no system lib required)
rusqlite = { version = "0.32", features = ["bundled"] }

# Field-level at-rest encryption for history text columns
# The cipher zeroises key material in memory on drop (defence in depth).
# رمزنگاری میدان‌ای برای ستون‌های متنی تاریخچه؛ کلید در حافظه هنگام drop پاک می‌شود.
chacha20poly1305 = { version = "0.10", features = ["zeroize"] }

# Explicit key-wiping on drop for the in-memory key copy. `Zeroizing`
# guarantees the key bytes are zeroed even if a panic unwinds mid-use.
# پاک‌کردن صریح کلید هنگام drop برای نسخهٔ کلید در حافظه؛ `Zeroizing`
# تضمین می‌کند حتی در panic نیز کلید صفر شود.
zeroize = "1"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Optional Tenor GIF search. Off by default so the release binary has no
# outbound HTTP client. Enable with: cargo build --features gif-search
# جستجوی اختیاری GIF در Tenor. پیش‌فرض خاموش است تا باینری انتشار
# کلاینت HTTP خروجی نداشته باشد.
gif-search = ["dep:reqwest"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
