name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Update version files
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "Syncing version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          echo "=== Versions after sync ==="
          echo "package.json: $(grep '"version"' package.json | head -1)"
          echo "tauri.conf.json: $(grep '"version"' src-tauri/tauri.conf.json | head -1)"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml | head -1)"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
          body: |
            ## Windows 11 Clipboard History For Linux ${{ github.ref_name }}
            
            A Windows 11-style Clipboard History Manager for Linux.
            
            ### 🚀 Quick Installation (Recommended)
            
            ```bash
            curl -fsSL https://raw.githubusercontent.com/gustavosett/Windows-11-Clipboard-History-For-Linux/master/scripts/install.sh | bash
            ```
            
            This script auto-detects your distro and sets up everything, including paste permissions.
            
            ---
            
            ### 📦 Manual Installation
            
            #### Ubuntu/Debian (APT Repository - enables auto-updates)
            ```bash
            curl -1sLf 'https://dl.cloudsmith.io/public/gustavosett/clipboard-manager/setup.deb.sh' | sudo -E bash
            sudo apt update && sudo apt install win11-clipboard-history
            sudo setfacl -m u:$USER:rw /dev/uinput  # For immediate paste access
            ```
            
            Or download the `.deb` directly:
            ```bash
            sudo apt install ./win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```
            
            #### Fedora/RHEL (DNF Repository - enables auto-updates)
            ```bash
            curl -1sLf 'https://dl.cloudsmith.io/public/gustavosett/clipboard-manager/setup.rpm.sh' | sudo -E bash
            sudo dnf install win11-clipboard-history
            sudo setfacl -m u:$USER:rw /dev/uinput  # For immediate paste access
            ```
            
            Or download the `.rpm` directly:
            ```bash
            sudo dnf install ./win11-clipboard-history-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```
            
            #### Arch Linux (AUR)
            ```bash
            yay -S win11-clipboard-history-bin
            ```
            
            #### AppImage (Universal - any distro)
            ```bash
            # Download, make executable, and set up paste permissions
            chmod +x win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            sudo setfacl -m u:$USER:rw /dev/uinput  # Required for paste simulation
            ./win11-clipboard-history_${{ steps.get_version.outputs.VERSION }}_amd64.AppImage
            ```
            
            > **Note:** The `setfacl` command is temporary (resets on reboot). For permanent setup, see the [README](https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux#appimage-universal).
            
            ---
            
            ### ⌨️ Usage
            
            Press **Super+V** to open the clipboard history. The app will show a Setup Wizard on first run to configure shortcuts and permissions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudsmith (stable releases only)
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
        continue-on-error: true
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "⚠️ CLOUDSMITH_API_KEY not set, skipping Cloudsmith upload"
            exit 0
          fi
          pip install cloudsmith-cli
          VERSION=${{ steps.get_version.outputs.VERSION }}
          
          echo "Uploading STABLE release v$VERSION to Cloudsmith..."
          
          # Upload all .deb files (x86_64 and arm64)
          deb_files=$(find artifacts -name '*.deb' 2>/dev/null)
          if [ -n "$deb_files" ]; then
            echo "$deb_files" | while read -r deb; do
              cloudsmith push deb gustavosett/clipboard-manager/any-distro/any-version \
                "$deb" --api-key $CLOUDSMITH_API_KEY || echo "Cloudsmith .deb upload failed for $deb (may already exist)"
            done
          else
            echo "No .deb files found to upload"
          fi
          
          # Upload all .rpm files (x86_64 and aarch64)
          rpm_files=$(find artifacts -name '*.rpm' 2>/dev/null)
          if [ -n "$rpm_files" ]; then
            echo "$rpm_files" | while read -r rpm; do
              cloudsmith push rpm gustavosett/clipboard-manager/any-distro/any-version \
                "$rpm" --api-key $CLOUDSMITH_API_KEY || echo "Cloudsmith .rpm upload failed for $rpm (may already exist)"
            done
          else
            echo "No .rpm files found to upload"
          fi

      - name: Update AUR Package
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
        continue-on-error: true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set, skipping AUR update"
            exit 0
          fi
          
          VERSION=${{ steps.get_version.outputs.VERSION }}
          
          # Find x86_64 and arm64 .deb files and compute checksums
          DEB_X86_64=$(find artifacts -name "*_amd64.deb" | head -1)
          DEB_ARM64=$(find artifacts -name "*_arm64.deb" | head -1)
          
          if [ -z "$DEB_X86_64" ]; then
            echo "x86_64 .deb not found, skipping AUR update"
            exit 0
          fi
          
          SHA256_X86_64=$(sha256sum "$DEB_X86_64" | cut -d' ' -f1)
          SHA256_ARM64=""
          if [ -n "$DEB_ARM64" ]; then
            SHA256_ARM64=$(sha256sum "$DEB_ARM64" | cut -d' ' -f1)
          fi
          
          echo "Updating AUR package to version $VERSION"
          echo "x86_64 checksum: $SHA256_X86_64"
          echo "arm64 checksum: $SHA256_ARM64"
          
          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking no" > ~/.ssh/config
          
          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/win11-clipboard-history-bin.git /tmp/aur-pkg
          cd /tmp/aur-pkg
          
          # Update PKGBUILD with multi-arch support
          cat > PKGBUILD << 'PKGBUILD_EOF'
          # Maintainer: Gustavo Sett <gustaavoribeeiro@hotmail.com>
          pkgname=win11-clipboard-history-bin
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="Windows 11-style Clipboard History Manager for Linux"
          arch=('x86_64' 'aarch64')
          url="https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux"
          license=('MIT')
          depends=(
              'webkit2gtk-4.1'
              'gtk3'
              'libayatana-appindicator'
              'xclip'
              'xdotool'
              'wl-clipboard'
              'acl'
              'polkit'
          )
          optdepends=(
              'libappindicator-gtk3: Legacy tray icon support'
          )
          provides=('win11-clipboard-history')
          conflicts=('win11-clipboard-history')
          options=('!strip' '!debug')
          source_x86_64=("${url}/releases/download/v${pkgver}/win11-clipboard-history_${pkgver}_amd64.deb")
          source_aarch64=("${url}/releases/download/v${pkgver}/win11-clipboard-history_${pkgver}_arm64.deb")
          sha256sums_x86_64=('SHA256_X86_64_PLACEHOLDER')
          sha256sums_aarch64=('SHA256_ARM64_PLACEHOLDER')
          install="${pkgname}.install"

          package() {
              cd "$srcdir"
              bsdtar -xf data.tar.* -C "$pkgdir/"
              
              chmod 755 "$pkgdir/usr/bin/win11-clipboard-history"
              chmod 755 "$pkgdir/usr/bin/win11-clipboard-history-bin" 2>/dev/null || true
              
              if [ -d "$pkgdir/etc/udev/rules.d" ]; then
                  mkdir -p "$pkgdir/usr/lib/udev/rules.d"
                  mv "$pkgdir/etc/udev/rules.d/"* "$pkgdir/usr/lib/udev/rules.d/"
                  rm -rf "$pkgdir/etc/udev"
              fi
              
              install -Dm644 /dev/stdin "$pkgdir/usr/share/licenses/$pkgname/LICENSE" << 'EOF'
          MIT License

          Copyright (c) 2024 Gustavo Sett

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          }
          PKGBUILD_EOF
          
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/" PKGBUILD
          sed -i "s/SHA256_X86_64_PLACEHOLDER/$SHA256_X86_64/" PKGBUILD
          if [ -n "$SHA256_ARM64" ]; then
            sed -i "s/SHA256_ARM64_PLACEHOLDER/$SHA256_ARM64/" PKGBUILD
          else
            sed -i "s/SHA256_ARM64_PLACEHOLDER/SKIP/" PKGBUILD
          fi
          
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' PKGBUILD
          
          # Generate .SRCINFO
          docker run --rm -v "$PWD:/pkg" archlinux bash -c "
            pacman -Sy --noconfirm pacman-contrib
            cd /pkg
            makepkg --printsrcinfo > .SRCINFO
          " || {
            echo "Docker failed, generating .SRCINFO manually"
            # Generate basic .SRCINFO manually
            cat > .SRCINFO << SRCINFO_EOF
          pkgbase = win11-clipboard-history-bin
          	pkgdesc = Windows 11-style Clipboard History Manager for Linux
          	pkgver = $VERSION
          	pkgrel = 1
          	url = https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux
          	install = win11-clipboard-history-bin.install
          	arch = x86_64
          	arch = aarch64
          	license = MIT
          	depends = webkit2gtk-4.1
          	depends = gtk3
          	depends = libayatana-appindicator
          	depends = xclip
          	depends = xdotool
          	depends = wl-clipboard
          	depends = acl
          	depends = polkit
          	optdepends = libappindicator-gtk3: Legacy tray icon support
          	provides = win11-clipboard-history
          	conflicts = win11-clipboard-history
          	options = !strip
          	options = !debug
          	source_x86_64 = https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux/releases/download/v$VERSION/win11-clipboard-history_${VERSION}_amd64.deb
          	sha256sums_x86_64 = $SHA256_X86_64
          	source_aarch64 = https://github.com/gustavosett/Windows-11-Clipboard-History-For-Linux/releases/download/v$VERSION/win11-clipboard-history_${VERSION}_arm64.deb
          	sha256sums_aarch64 = ${SHA256_ARM64:-SKIP}

          pkgname = win11-clipboard-history-bin
          SRCINFO_EOF
            sed -i 's/^          //' .SRCINFO
          }
          
          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $VERSION (x86_64 + aarch64)" || echo "No changes to commit"
          git push || echo "Push failed - may need manual intervention"
